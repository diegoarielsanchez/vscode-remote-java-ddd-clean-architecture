# ── Database (H2 in-memory — replaces SQL Server for tests) ─────────────────
spring.datasource.url=jdbc:h2:mem:visitservicetest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── Disable RabbitMQ (no broker in test environment) ────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ── Disable Eureka ──────────────────────────────────────────────────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ── JWT secret (must be >= 32 chars to pass JwtSecretValidator) ──────────────
jwt.secret=test-secret-key-for-integration-tests-only-32chars

# ── Inter-service stubs (no real services running in tests) ─────────────────
services.msr.base-url=http://localhost:0
services.hcp.base-url=http://localhost:0
