# ── Production profile — ALL secrets are REQUIRED (no fallback defaults) ────
# Set SPRING_PROFILES_ACTIVE=prod to activate this profile.
# Startup will fail immediately if any of these env vars are absent.

# Database (SQL Server)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Network: bind to all interfaces — Docker internal network provides isolation
server.address=0.0.0.0
eureka.instance.ip-address=

# Schema management — never auto-alter schema in production
spring.jpa.hibernate.ddl-auto=validate

# JWT
jwt.secret=${JWT_SECRET}

# Inter-service HTTP clients resolved via Eureka (spring-cloud-starter-loadbalancer)
# No static base-url properties needed; service names are resolved from the registry.

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Logging — never DEBUG in production (fix #6)
logging.level.org.springframework.security=INFO
logging.level.com.das=INFO

# Swagger / OpenAPI — disabled in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
