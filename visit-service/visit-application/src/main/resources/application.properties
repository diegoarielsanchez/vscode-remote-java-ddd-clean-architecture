server.port=8088
# Network isolation: bind to loopback so only processes on this host reach port 8088.
# In Docker, server.address is overridden to 0.0.0.0 and Docker network isolation applies.
server.address=${SERVER_ADDRESS:127.0.0.1}
# spring.profiles.active=dev
spring.application.name=visit-service

# OWASP Security Configurations
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Spring Security
app.security.user.name=${APP_SECURITY_USER_NAME:}
app.security.user.password-hash=${APP_SECURITY_USER_PASSWORD_HASH:}
app.security.user.roles=${APP_SECURITY_USER_ROLES:USER}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Database (SQL Server) — credentials via environment variables
spring.datasource.url=${DB_URL:jdbc:sqlserver://sqlserver-ddd-clean:1433;databaseName=visitdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.das=INFO
logging.file.name=logs/visit-service.log

# Session Management
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-development-only-32chars}
jwt.expiration=3600000

# Inter-service HTTP clients resolved via Eureka (spring-cloud-starter-loadbalancer)
# URLs use logical service names; @LoadBalanced RestTemplate resolves them at call time.

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka/}
# Do NOT set eureka.instance.ip-address — empty string causes NPE in Eureka URL builder.
# With prefer-ip-address=true, Spring Cloud auto-detects the container IP at runtime.
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# RabbitMQ (Option B — event-driven snapshot)
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-ddd-clean}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
