server.port=8089
# Network isolation: bind to loopback so only processes on this host reach port 8089.
# In Docker, server.address is overridden to 0.0.0.0 and Docker network isolation applies.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.active=dev
spring.application.name=settlement-service

# OWASP Security Configurations
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Spring Security
app.security.user.name=${APP_SECURITY_USER_NAME:}
app.security.user.password-hash=${APP_SECURITY_USER_PASSWORD_HASH:}
app.security.user.roles=${APP_SECURITY_USER_ROLES:USER}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Database (MySQL) — credentials via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://172.17.0.1:3308/settlementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:riverplate}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.das=INFO
logging.file.name=logs/settlement-service.log

# Session Management
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-development-only-32chars}
jwt.expiration=3600000

# Eureka Service Discovery
# ip-address=127.0.0.1 matches server.address so gateway resolves services to loopback.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka/}
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# MedicalSalesRep service (used by IMedicalSalesRepPort to validate existence and active status)
msr.service.base-url=${MSR_SERVICE_BASE_URL:http://localhost:8086}

# Invoice digital file storage — files are written to: <path>/<invoiceId>/<fileName>
# Used only when the "minio" profile is NOT active (LocalDiskInvoiceFileStorage).
invoice.file.storage.path=${INVOICE_FILE_STORAGE_PATH:/tmp/settlement-service/invoice-files}

# MinIO / S3-compatible object storage (activate by adding "minio" to SPRING_PROFILES_ACTIVE)
# Example: SPRING_PROFILES_ACTIVE=dev,minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:invoice-files}

# Multipart upload limits — reject oversized requests at the HTTP layer before heap allocation
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
