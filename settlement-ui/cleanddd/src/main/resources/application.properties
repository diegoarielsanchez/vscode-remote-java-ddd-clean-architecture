spring.application.name=cleanddd
server.port=8081
settlement.api.base-url=${SETTLEMENT_API_BASE_URL:http://settlement-service/api/v1/settlement}

# identity-service — used to obtain a JWT bearer token forwarded to downstream APIs.
# IMPORTANT: override IDENTITY_CLIENT_PASSWORD via env var; never commit a real password.
identity.service.base-url=${IDENTITY_SERVICE_BASE_URL:http://identity-service}
identity.client.username=${IDENTITY_CLIENT_USERNAME:user}
identity.client.password=${IDENTITY_CLIENT_PASSWORD:Apatehia65$}
identity.client.token-ttl-seconds=${IDENTITY_CLIENT_TOKEN_TTL_SECONDS:3600}

# Eureka Service Discovery — required for the @LoadBalanced RestTemplate beans to resolve
# settlement-service / identity-service logical names to live instances.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
