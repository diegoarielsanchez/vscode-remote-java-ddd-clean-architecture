# Production Docker Compose — network isolation enforced at the Docker layer.
#
# Network topology:
#   frontend  (bridge, host-accessible) — gateway only, port 8080 published
#   backend   (internal: true)          — all services; no host access to 8086-8089
#
# Observability: every service is auto-instrumented via the OpenTelemetry Java
# agent (baked into each image) and exports OTLP traces + metrics + logs to
# otel-collector, which fans them out to Jaeger (traces), Prometheus (metrics),
# and Loki (logs); Grafana is pre-wired with all three as datasources.
#   Jaeger UI:     http://localhost:16686
#   Prometheus UI: http://localhost:9090
#   Loki API:      http://localhost:3100  (queried through Grafana, not a UI)
#   Grafana UI:    http://localhost:3000  (admin / see GRAFANA_ADMIN_PASSWORD)
#
# Required env vars: copy .env.example → .env and fill in secrets before running.
#   docker compose up -d

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true      # no route to/from the Docker host on this network
  ddd-clean-net:
    external: true      # pre-existing network where rabbitmq-ddd-clean runs

services:

  # ── Eureka Service Registry ────────────────────────────────────────────────
  eureka-server:
    container_name: eureka-server-ddd-clean
    build:
      context: eureka-server
      dockerfile: Dockerfile
    networks: [frontend, backend]   # frontend allows host access on port 8761
    ports:
      - "8761:8761"             # Publish so the UI is accessible from the host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USER: ${EUREKA_USER}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOSTNAME: eureka-server
      OTEL_SERVICE_NAME: eureka-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    # No ports: — Eureka is only reachable inside the backend network

  # ── API Gateway (sole public entry point) ──────────────────────────────────
  api-gateway:
    container_name: api-gateway-ddd-clean
    build:
      context: api-gateway
      dockerfile: Dockerfile
    networks: [frontend, backend]   # bridges public traffic into the backend
    ports:
      - "8080:8080"                 # ONLY port reachable from the host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  # ── Medical Sales Rep Service ──────────────────────────────────────────────
  medical-sales-rep-service:
    # No container_name: Compose needs to name each replica itself (<project>_medical-sales-rep-service_N).
    # Scale with: docker compose up -d --scale medical-sales-rep-service=3
    deploy:
      replicas: 2
    build:
      context: medical-sales-rep-service
      dockerfile: msr-application/Dockerfile
      additional_contexts:
        domain-commons: domain-commons
    networks: [backend, ddd-clean-net]  # ddd-clean-net for rabbitmq-ddd-clean hostname
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${MSR_DB_URL}
      PG_USERNAME: ${MSR_PG_USERNAME}
      PG_PASSWORD: ${MSR_PG_PASSWORD}
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-ddd-clean}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_SERVICE_NAME: medical-sales-rep-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    # No ports: — only reachable via gateway through Eureka discovery

  # ── Healthcare Professional Service ────────────────────────────────────────
  healthcare-prof-service:
    # No container_name: Compose needs to name each replica itself (<project>_healthcare-prof-service_N).
    # Scale with: docker compose up -d --scale healthcare-prof-service=3
    deploy:
      replicas: 2
    build:
      context: healthcare-prof-service
      dockerfile: hcp-application/Dockerfile
      additional_contexts:
        domain-commons: domain-commons
    networks: [backend, ddd-clean-net]  # ddd-clean-net for rabbitmq-ddd-clean hostname
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${HCP_DB_URL}
      PG_USERNAME: ${HCP_PG_USERNAME}
      PG_PASSWORD: ${HCP_PG_PASSWORD}
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-ddd-clean}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_SERVICE_NAME: healthcare-prof-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ── Visit Service ──────────────────────────────────────────────────────────
  visit-service:
    # No container_name: Compose needs to name each replica itself (<project>_visit-service_N).
    # Scale with: docker compose up -d --scale visit-service=3
    deploy:
      replicas: 2
    build:
      context: visit-service
      dockerfile: visit-application/Dockerfile
      additional_contexts:
        domain-commons: domain-commons
        medical-sales-rep-service: medical-sales-rep-service
        healthcare-prof-service: healthcare-prof-service
    networks: [backend, ddd-clean-net]  # ddd-clean-net for rabbitmq-ddd-clean hostname
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${VISIT_DB_URL}
      DB_USERNAME: ${VISIT_DB_USERNAME}
      DB_PASSWORD: ${VISIT_DB_PASSWORD}
      MSR_BASE_URL: http://medical-sales-rep-service:8086
      HCP_BASE_URL: http://healthcare-prof-service:8087
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-ddd-clean}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_SERVICE_NAME: visit-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ── Identity Service ──────────────────────────────────────────────────────
  identity-service:
    container_name: identity-service-ddd-clean
    build:
      context: identity-service
      dockerfile: identity-application/Dockerfile
    networks: [frontend, backend]   # frontend allows direct host access on port 8090
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      OTEL_SERVICE_NAME: identity-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ── Settlement Service ─────────────────────────────────────────────────────
  settlement-service:
    # No container_name: Compose needs to name each replica itself (<project>_settlement-service_N).
    # Scale with: docker compose up -d --scale settlement-service=3
    deploy:
      replicas: 2
    build:
      context: settlement-service
      dockerfile: settlement-application/Dockerfile
      additional_contexts:
        domain-commons: domain-commons
    networks: [backend, ddd-clean-net]  # ddd-clean-net allows reaching MySQL on the Docker host (172.17.0.1)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${SETTLEMENT_DB_URL}
      DB_USERNAME: ${SETTLEMENT_DB_USERNAME}
      DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD}
      # Logical Eureka service name — resolved to an instance by the @LoadBalanced RestTemplate.
      MSR_SERVICE_BASE_URL: http://medical-sales-rep-service
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
      INVOICE_FILE_STORAGE_PATH: /var/settlement-service/invoice-files
      OTEL_SERVICE_NAME: settlement-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ddd-clean-architecture
    volumes:
      - invoice-files:/var/settlement-service/invoice-files
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ── Settlement UI (server-rendered console) ────────────────────────────────
  settlement-ui:
    container_name: settlement-ui-ddd-clean
    build:
      context: .
      dockerfile: settlement-ui/cleanddd/Dockerfile
    networks: [frontend, backend]   # frontend allows host access on port 8081
    ports:
      - "8081:8081"
    environment:
      # Logical Eureka service names — resolved to an instance by the @LoadBalanced RestTemplate beans.
      SETTLEMENT_API_BASE_URL: http://settlement-service/api/v1/settlement
      IDENTITY_SERVICE_BASE_URL: http://identity-service
      IDENTITY_CLIENT_USERNAME: ${IDENTITY_CLIENT_USERNAME}
      IDENTITY_CLIENT_PASSWORD: ${IDENTITY_CLIENT_PASSWORD}
      EUREKA_URL: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      settlement-service:
        condition: service_started
      identity-service:
        condition: service_started
    restart: unless-stopped

  # ── Observability: Loki (log storage) ──────────────────────────────────────
  loki:
    container_name: loki
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks: [frontend, backend]
    ports:
      - "3100:3100"             # Loki API (used by Grafana + the collector)
    restart: unless-stopped

  # ── Observability: OpenTelemetry Collector ─────────────────────────────────
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks: [frontend, backend]
    depends_on:
      - loki
    restart: unless-stopped

  # ── Observability: Jaeger (trace storage + UI) ─────────────────────────────
  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [frontend, backend]
    ports:
      - "16686:16686"           # Jaeger UI
    restart: unless-stopped

  # ── Observability: Prometheus (metrics storage) ────────────────────────────
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [frontend, backend]
    ports:
      - "9090:9090"             # Prometheus UI
    restart: unless-stopped

  # ── Observability: Grafana (dashboards) ────────────────────────────────────
  grafana:
    container_name: grafana
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [frontend, backend]
    ports:
      - "3000:3000"             # Grafana UI
    depends_on:
      - prometheus
      - jaeger
      - loki
    restart: unless-stopped

volumes:
  invoice-files:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
