# Development Docker Compose override — adds MinIO as a local, S3-compatible
# file-storage backend. Use this instead of the named-volume approach when you
# want to mirror production cloud-object-storage behaviour without SMB/NFS.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# MinIO UI: http://localhost:9001  (user: minioadmin / minioadmin)
# S3 API:   http://localhost:9000
#
# To use MinIO you must implement MinioInvoiceFileStorage in settlement-infra
# and set the env vars below. See settlement-infra MinioInvoiceFileStorage.java.
#
# For a single-instance dev run without MinIO, use the named volume that
# docker-compose.yml already defines — no extra tooling needed.

services:

  # ── MinIO — S3-compatible object storage for invoice files ─────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (used by settlement-service)
      - "9001:9001"   # MinIO web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]

  # ── MinIO bucket initialiser ───────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/invoice-files &&
        mc anonymous set none local/invoice-files &&
        echo 'Bucket invoice-files ready.'
      "
    restart: no

  # ── Settlement Service (dev override) — point to MinIO instead of disk ─────
  settlement-service:
    environment:
      # When using MinIO, set INVOICE_FILE_STORAGE_PATH to point to a local
      # directory OR swap to the Minio-backed adapter by overriding the Spring
      # bean (profile 'minio').  The local-disk adapter still works for dev.
      INVOICE_FILE_STORAGE_PATH: /var/settlement-service/invoice-files
      # MinIO connection properties (used only if MinioInvoiceFileStorage is active)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: invoice-files

volumes:
  minio-data:
    driver: local
