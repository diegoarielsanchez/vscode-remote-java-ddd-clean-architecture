server.port=8090
# Bind to loopback in dev; Docker overrides to 0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.active=dev
spring.application.name=identity-service

# ── OWASP: suppress sensitive error details (A05) ─────────────────────────
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ── JWT ───────────────────────────────────────────────────────────────────
# IMPORTANT: override JWT_SECRET with a 256-bit random value in production.
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-development-only-32chars}
jwt.expiration=3600000

# ── Seed user (OWASP A07) ─────────────────────────────────────────────────
# The password is a BCrypt hash, never plain text. Dev default: user / Apatehia65$
# (used by README and the simulate/stress scripts). Prod requires its own — see application-prod.
identity.seed-user.username=${IDENTITY_SEED_USERNAME:user}
identity.seed-user.password-hash=${IDENTITY_SEED_PASSWORD_HASH:$2a$12$oxidnedWihAzJbsAXyZH5OX3caBTkilYZ5Zn0pqpUt.Fv/CiYUH26}

# AI Agent Service account (ROLE_AGENT) — the only caller that may approve/reject orders and
# change stock. Off unless configured, in every profile: no default credential can do that.
identity.agent-user.username=${IDENTITY_AGENT_USERNAME:}
identity.agent-user.password-hash=${IDENTITY_AGENT_PASSWORD_HASH:}

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging / audit ───────────────────────────────────────────────────────
logging.level.org.springframework.security=INFO
logging.level.com.das=INFO
logging.file.name=logs/identity-service.log

# ── Session hardening (OWASP A07) ─────────────────────────────────────────
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ── Eureka Service Discovery ──────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka/}
# Do NOT set eureka.instance.ip-address — empty string causes NPE in Eureka URL builder.
# With prefer-ip-address=true, Spring Cloud auto-detects the container IP at runtime.
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
