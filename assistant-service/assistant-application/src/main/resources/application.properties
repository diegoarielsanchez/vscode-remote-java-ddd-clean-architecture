server.port=8093
# Network isolation: bind to loopback so only processes on this host reach port 8093.
# In Docker, server.address is overridden to 0.0.0.0 and Docker network isolation applies.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=assistant-service

# OWASP Security Configurations
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.das=INFO
logging.file.name=logs/assistant-service.log

# JWT Configuration (tokens issued by identity-service)
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-development-only-32chars}
jwt.expiration=3600000

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka@localhost:8761/eureka/}
# Do NOT set eureka.instance.ip-address — empty string causes NPE in Eureka URL builder.
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── Assistant ───────────────────────────────────────────────────────────────
# Off until validated (GAMP 5): while false, no model is called, no API key is needed and
# /api/v1/assistant/** answers 404. It cannot be turned on under the prod profile while drafts,
# conversations and the audit trail are still kept in memory.
assistant.enabled=${ASSISTANT_ENABLED:false}
# The model and prompt are part of the validated configuration: change them only under change control.
assistant.model.id=claude-opus-5-5
assistant.model.effort=medium
assistant.model.max-tokens=16000
assistant.prompt=system-v1
assistant.max-steps-per-message=8
assistant.draft.ttl=PT2H
assistant.rate-limit.messages-per-minute=10
# From the environment or the secret store only, never written here
assistant.anthropic.api-key=${ANTHROPIC_API_KEY:}
assistant.anthropic.timeout=PT60S

# Swagger UI webjar pinned in the service pom (DOMPurify CVE fix). springdoc looks the UI up under the version it
# was built with, so this must name the pinned webjar or /swagger-ui answers 404.
springdoc.swagger-ui.version=5.34.1
